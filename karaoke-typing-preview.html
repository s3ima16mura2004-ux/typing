<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライブステージ・タイピング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep: #0d0b1a;
  --bg-panel: #171330;
  --gold: #ffd166;
  --pink: #ff6fa5;
  --cyan: #6fd9ff;
  --ink: #f5f0ea;
  --ink-dim: #b9b3d6;
  --miss: #ff4d5e;
  --font-display: "M PLUS 1p", sans-serif;
  --font-body: "Zen Kaku Gothic New", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}

*{ box-sizing: border-box; }

body{
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #000;
  font-family: var(--font-body);
  color: var(--ink);
  padding: 10px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

.stage{
  position: relative;
  width: 100%;
  max-width: 720px;
  aspect-ratio: 9 / 14;
  max-height: 96vh;
  overflow: hidden;
  background:
    radial-gradient(ellipse 120% 60% at 50% 8%, rgba(255,209,102,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, #120f26 55%, #08060f 100%);
  border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}

/* ---------- 客席のペンライト ---------- */
.crowd{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 34%;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 6px 4px;
  padding: 18px 22px 22px;
  align-content: end;
}

.penlight{
  width: 100%;
  aspect-ratio: 1 / 2.4;
  border-radius: 40% 40% 20% 20%;
  background: #241f3d;
  opacity: 0.5;
  transform-origin: bottom center;
  transform: rotate(0deg);
  transition: background 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
}

.penlight.lit{
  opacity: 1;
  animation: sway 1.6s ease-in-out infinite;
  box-shadow: 0 0 14px 2px var(--glow, var(--gold));
  background: var(--glow, var(--gold));
}

@keyframes sway{
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

/* ---------- スポットライト ---------- */
.spotlight{
  position: absolute;
  top: -20%;
  left: 50%;
  width: 140%;
  height: 70%;
  transform: translateX(-50%);
  background: radial-gradient(ellipse 40% 60% at 50% 0%, rgba(255,209,102,0.18), transparent 70%);
  pointer-events: none;
  opacity: 0.6;
  transition: opacity 0.15s ease;
}

.spotlight.burst{
  animation: burst 0.5s ease-out;
}

@keyframes burst{
  0% { opacity: 1; background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(255,209,102,0.55), transparent 70%); }
  100% { opacity: 0.6; }
}

/* ---------- HUD ---------- */
.hud{
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px 0;
}

.hud-block{ display: flex; flex-direction: column; line-height: 1.1; }
.hud-block--time{ align-items: flex-end; }

.hud-label{
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-dim);
}

.hud-value{
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 22px;
  color: var(--ink);
}

.hud-combo{
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  margin-top: 2px;
}

.hud-combo.boosted{
  animation: comboPulse 0.5s ease infinite;
}

@keyframes comboPulse{
  0%,100%{ filter: brightness(1); transform: scale(1); }
  50%{ filter: brightness(1.6); transform: scale(1.08); }
}

#timeValue.time-warn{ color: var(--miss); }

.hype-wrap{ flex: 1; display: flex; flex-direction: column; gap: 4px; }
.hype-bar{
  height: 8px;
  border-radius: 5px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.hype-fill{
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--pink), var(--gold));
  transition: width 0.15s ease;
}
.hype-fill.maxed{ animation: pulseHype 0.6s ease infinite; }
@keyframes pulseHype{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.5); }
}

/* ---------- ミュートボタン ---------- */
.mute-btn{
  position: absolute;
  top: 14px;
  left: 18px;
  z-index: 4;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
.mute-btn:hover{ background: rgba(255,255,255,0.16); }
.mute-btn:active{ transform: scale(0.92); }
.mute-btn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- HYPE満タンバナー ---------- */
.hype-banner{
  position: absolute;
  top: 22%;
  left: 50%;
  z-index: 5;
  transform: translate(-50%, -50%) scale(0.7);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(22px, 6vw, 30px);
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,209,102,0.6);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
}

.hype-banner.show{
  animation: hypeBanner 1.2s ease forwards;
}

@keyframes hypeBanner{
  0%{ opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  15%{ opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  30%{ transform: translate(-50%, -50%) scale(1); }
  75%{ opacity: 1; }
  100%{ opacity: 0; transform: translate(-50%, -50%) scale(1); }
}

.crowd.wave .penlight.lit{
  animation: swayBig 0.5s ease-in-out infinite;
}

@keyframes swayBig{
  0%, 100% { transform: rotate(-14deg) scale(1.08); }
  50% { transform: rotate(14deg) scale(1.08); }
}
.mic{
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 4;
  color: var(--ink-dim);
  transition: color 0.15s ease, transform 0.15s ease;
}
.mic.miss{
  color: var(--miss);
  animation: shake 0.3s ease;
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  25%{ transform: translateX(-3px) rotate(-4deg); }
  75%{ transform: translateX(3px) rotate(4deg); }
}

/* ---------- プロンプター ---------- */
.prompter{
  position: relative;
  z-index: 2;
  text-align: center;
  margin-top: 10%;
  padding: 0 20px;
}

.prompter-kana{
  font-size: 15px;
  color: var(--ink-dim);
  letter-spacing: 0.15em;
  margin: 0 0 4px;
  min-height: 1.2em;
}

.prompter-word{
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(32px, 8vw, 48px);
  margin: 0;
  letter-spacing: 0.04em;
  text-shadow: 0 0 24px rgba(255,209,102,0.35);
}

.prompter-romaji{
  font-family: var(--font-mono);
  font-size: clamp(18px, 5vw, 24px);
  letter-spacing: 0.08em;
  margin: 10px 0 0;
  min-height: 1.4em;
}

.romaji-done{ color: var(--gold); }
.romaji-next{ color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.romaji-rest{ color: var(--ink-dim); }

/* ---------- オーバーレイ ---------- */
.overlay{
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px;
  background: rgba(8,6,15,0.92);
  backdrop-filter: blur(2px);
}

.overlay[hidden]{
  display: none;
}

.overlay-title{
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(28px, 7vw, 40px);
  margin: 0 0 14px;
  color: var(--gold);
}

.overlay-text{
  color: var(--ink-dim);
  line-height: 1.8;
  margin-bottom: 26px;
}

/* ---------- 難易度選択 ---------- */
.diff-select{
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.diff-btn{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 84px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  background: var(--bg-panel);
  color: var(--ink-dim);
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.diff-btn-title{
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
}

.diff-btn-desc{
  font-size: 10px;
  opacity: 0.8;
}

.diff-btn.active{
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--gold), var(--pink));
  border-color: transparent;
  transform: translateY(-2px);
}

.diff-btn:focus-visible{
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

.best-note{
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--ink-dim);
  margin: 0 0 22px;
}

.best-note .is-new{
  color: var(--gold);
  font-weight: 700;
}

.overlay-btn{
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  color: var(--bg-deep);
  background: linear-gradient(90deg, var(--gold), var(--pink));
  border: none;
  border-radius: 999px;
  padding: 14px 32px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.overlay-btn:hover{ transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,209,102,0.3); }
.overlay-btn:focus-visible{ outline: 3px solid var(--cyan); outline-offset: 3px; }

.result-stats{
  display: flex;
  gap: 28px;
  margin: 0 0 30px;
}
.result-stats > div{ display: flex; flex-direction: column; align-items: center; gap: 4px; }
.result-num{
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
}

@media (max-width: 400px){
  .crowd{ grid-template-columns: repeat(7, 1fr); }
}

/* ---------- オンスクリーンキーボードエリア ---------- */
.kbd-area{
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  user-select: none;
}

/* キーボード切り替えトグル */
.kbd-toggle{
  display: flex;
  gap: 6px;
  align-self: center;
}

.kbd-toggle-btn{
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--ink-dim);
  background: var(--bg-panel);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px;
  padding: 7px 16px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}

.kbd-toggle-btn.active{
  color: var(--bg-deep);
  background: linear-gradient(90deg, var(--gold), var(--pink));
  border-color: transparent;
}

.kbd-toggle-btn:focus-visible{
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

/* 専用オンスクリーンキーボード */
.vkb{
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.vkb[hidden]{ display: none; }

.vkb-row{
  display: flex;
  justify-content: center;
  gap: 5px;
}

.vkb-key{
  flex: 1;
  max-width: 42px;
  aspect-ratio: 1 / 1;
  border: none;
  border-radius: 8px;
  background: var(--bg-panel);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  text-transform: lowercase;
  box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.1s ease, transform 0.1s ease;
}

.vkb-key:active,
.vkb-key.pressed{
  background: var(--gold);
  color: var(--bg-deep);
  transform: translateY(1px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.4);
}

.vkb-key--wide{
  max-width: 56px;
  font-size: 16px;
}

.kbd-hint{
  margin: 0;
  text-align: center;
  font-size: 11px;
  color: var(--ink-dim);
}

/* 端末純正キーボード用の入力欄 */
.native-input{
  width: 100%;
  box-sizing: border-box;
  font-family: var(--font-mono);
  font-size: 16px; /* iOSの自動ズームを防ぐため16px以上 */
  color: var(--ink);
  background: var(--bg-panel);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
  letter-spacing: 0.1em;
}

.native-input::placeholder{
  color: var(--ink-dim);
}

.native-input:focus{
  outline: none;
  border-color: var(--gold);
}

.native-input[hidden]{ display: none; }

/* 物理キーボードがある環境（PC等）では入力エリア全体を非表示にする */
@media (hover: hover) and (pointer: fine){
  .kbd-area{ display: none; }
}

</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- 客席のペンライト -->
  <div class="crowd" id="crowd"></div>

  <!-- スポットライト -->
  <div class="spotlight" id="spotlight"></div>

  <!-- ミュートボタン -->
  <button class="mute-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="音を消す">🔊</button>

  <!-- HUD -->
  <header class="hud">
    <div class="hud-block">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="scoreValue">0</span>
      <span class="hud-combo" id="comboValue" hidden></span>
    </div>
    <div class="hype-wrap">
      <span class="hud-label">HYPE</span>
      <div class="hype-bar"><div class="hype-fill" id="hypeFill"></div></div>
    </div>
    <div class="hud-block hud-block--time">
      <span class="hud-label">TIME</span>
      <span class="hud-value" id="timeValue">60</span>
    </div>
  </header>

  <!-- HYPE満タン時のバナー -->
  <div class="hype-banner" id="hypeBanner">熱狂の渦！</div>

  <!-- マイク（ミス時に赤く光る） -->
  <div class="mic" id="mic">
    <svg viewBox="0 0 24 24" width="40" height="40">
      <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
    </svg>
  </div>

  <!-- プロンプター（お題表示） -->
  <main class="prompter">
    <p class="prompter-kana" id="promptKana">&nbsp;</p>
    <h1 class="prompter-word" id="promptWord">START</h1>
    <p class="prompter-romaji" id="promptRomaji">&nbsp;</p>
  </main>

  <!-- スタート画面 -->
  <div class="overlay" id="startOverlay">
    <h2 class="overlay-title">MIC CHECK</h2>
    <p class="overlay-text">表示された単語をローマ字・またはかなで打ち切って、<br>客席のペンライトを灯していこう。<br>制限時間は60秒のスコアアタック。</p>

    <div class="diff-select" id="diffSelect" role="group" aria-label="難易度選択">
      <button type="button" class="diff-btn" data-diff="easy">
        <span class="diff-btn-title">かんたん</span>
        <span class="diff-btn-desc">短い単語中心</span>
      </button>
      <button type="button" class="diff-btn active" data-diff="normal">
        <span class="diff-btn-title">ふつう</span>
        <span class="diff-btn-desc">バランス型</span>
      </button>
      <button type="button" class="diff-btn" data-diff="hard">
        <span class="diff-btn-title">むずかしい</span>
        <span class="diff-btn-desc">長めの単語中心</span>
      </button>
    </div>

    <p class="best-note" id="startBest">自己ベスト：-</p>

    <button class="overlay-btn" id="startBtn">ステージに立つ</button>
  </div>

  <!-- 結果画面 -->
  <div class="overlay" id="resultOverlay" hidden>
    <h2 class="overlay-title" id="resultRank">-</h2>
    <p class="best-note" id="resultBest">自己ベスト：-</p>
    <div class="result-stats">
      <div><span class="hud-label">SCORE</span><span class="result-num" id="resultScore">0</span></div>
      <div><span class="hud-label">正打数</span><span class="result-num" id="resultChars">0</span></div>
      <div><span class="hud-label">正答率</span><span class="result-num" id="resultAcc">0%</span></div>
    </div>
    <button class="overlay-btn" id="retryBtn">アンコール（もう一度）</button>
  </div>

</div>

<!-- タッチ端末用の入力エリア（物理キーボードがある環境では自動的に隠れる） -->
<div class="kbd-area" id="kbdArea" aria-hidden="true">

  <!-- キーボード切り替えトグル -->
  <div class="kbd-toggle" id="kbdToggle" role="group" aria-label="入力方法の切り替え">
    <button type="button" class="kbd-toggle-btn active" data-mode="custom">専用キーボード</button>
    <button type="button" class="kbd-toggle-btn" data-mode="native">端末のキーボード</button>
  </div>

  <!-- 専用オンスクリーンキーボード -->
  <div class="vkb" id="vkb">
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="q">q</button>
      <button type="button" class="vkb-key" data-key="w">w</button>
      <button type="button" class="vkb-key" data-key="e">e</button>
      <button type="button" class="vkb-key" data-key="r">r</button>
      <button type="button" class="vkb-key" data-key="t">t</button>
      <button type="button" class="vkb-key" data-key="y">y</button>
      <button type="button" class="vkb-key" data-key="u">u</button>
      <button type="button" class="vkb-key" data-key="i">i</button>
      <button type="button" class="vkb-key" data-key="o">o</button>
      <button type="button" class="vkb-key" data-key="p">p</button>
    </div>
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="a">a</button>
      <button type="button" class="vkb-key" data-key="s">s</button>
      <button type="button" class="vkb-key" data-key="d">d</button>
      <button type="button" class="vkb-key" data-key="f">f</button>
      <button type="button" class="vkb-key" data-key="g">g</button>
      <button type="button" class="vkb-key" data-key="h">h</button>
      <button type="button" class="vkb-key" data-key="j">j</button>
      <button type="button" class="vkb-key" data-key="k">k</button>
      <button type="button" class="vkb-key" data-key="l">l</button>
    </div>
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="z">z</button>
      <button type="button" class="vkb-key" data-key="x">x</button>
      <button type="button" class="vkb-key" data-key="c">c</button>
      <button type="button" class="vkb-key" data-key="v">v</button>
      <button type="button" class="vkb-key" data-key="b">b</button>
      <button type="button" class="vkb-key" data-key="n">n</button>
      <button type="button" class="vkb-key" data-key="m">m</button>
      <button type="button" class="vkb-key vkb-key--wide" data-key="-">ー</button>
    </div>
  </div>

  <p class="kbd-hint">※「つ」は tu、長音は ー（ハイフン）でも入力できます</p>

  <!-- 端末純正キーボード用の入力欄 -->
  <input
    type="text"
    id="nativeInput"
    class="native-input"
    placeholder="ここをタップしてローマ字 or かなで入力"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    inputmode="text"
    aria-label="ローマ字入力欄"
    hidden
  >
</div>

<script>
/* =========================================================
   ライブステージ・タイピング
   打鍵ごとに客席のペンライトが1本ずつ灯っていくタイピングゲーム
   ========================================================= */

// ---------- お題リスト（難易度別） ----------
// word: 表示語 / kana: ふりがな（かな入力の正解） / romaji: 正解ローマ字（表記ゆれは配列で複数指定）

const EASY_WORDS = [
  { word: "夢",   kana: "ゆめ",   romaji: ["yume"] },
  { word: "叫べ", kana: "さけべ", romaji: ["sakebe"] },
  { word: "涙",   kana: "なみだ", romaji: ["namida"] },
  { word: "奇跡", kana: "きせき", romaji: ["kiseki"] },
  { word: "明日", kana: "あした", romaji: ["ashita"] },
  { word: "希望", kana: "きぼう", romaji: ["kibou"] },
  { word: "光",   kana: "ひかり", romaji: ["hikari"] },
  { word: "本気", kana: "ほんき", romaji: ["honki"] },
  { word: "絆",   kana: "きずな", romaji: ["kizuna"] },

const NORMAL_WORDS = [
  { word: "情熱",   kana: "じょうねつ", romaji: ["jounetsu", "zyounetsu"] },
  { word: "声援",   kana: "せいえん",   romaji: ["seien"] },
  { word: "拍手",   kana: "はくしゅ",   romaji: ["hakushu", "hakusyu"] },
  { word: "運命",   kana: "うんめい",   romaji: ["unmei"] },
  { word: "青春",   kana: "せいしゅん", romaji: ["seishun", "seisyun"] },
  { word: "太陽",   kana: "たいよう",   romaji: ["taiyou"] },
  { word: "旅立ち", kana: "たびだち",   romaji: ["tabidachi", "tabidati"] },
  { word: "花道",   kana: "はなみち",   romaji: ["hanamichi", "hanamiti"] },
  { word: "歓声",   kana: "かんせい",   romaji: ["kansei"] },
  { word: "熱狂",   kana: "ねっきょう", romaji: ["nekkyou"] },
  { word: "喝采",   kana: "かっさい",   romaji: ["kassai"] },
  { word: "全力",   kana: "ぜんりょく", romaji: ["zenryoku"] },
  { word: "アンコール", kana: "あんこーる", romaji: ["ankoru", "ankooru"] },
  { word: "煌めき", kana: "きらめき",   romaji: ["kirameki"] },
  { word: "最高",   kana: "さいこう",   romaji: ["saikou"] },
  { word: "感謝",   kana: "かんしゃ",   romaji: ["kansha", "kansya"] },
  { word: "魂",     kana: "たましい",   romaji: ["tamashii", "tamasii"] },
  { word: "全開",   kana: "ぜんかい",   romaji: ["zenkai"] },
];

const HARD_WORDS = [
  { word: "主人公",     kana: "しゅじんこう",     romaji: ["shujinkou", "syuzinkou"] },
  { word: "一期一会",   kana: "いちごいちえ",     romaji: ["ichigoichie", "itigoitie"] },
  { word: "喉が枯れる", kana: "のどがかれる",     romaji: ["nodogakareru"] },
  { word: "感無量",     kana: "かんむりょう",     romaji: ["kanmuryou"] },
  { word: "拍手喝采",   kana: "はくしゅかっさい", romaji: ["hakushukassai", "hakusyukassai"] },
  { word: "一世一代",   kana: "いっせいちだい",   romaji: ["isseichidai"] },
  { word: "声を枯らして", kana: "こえをからして", romaji: ["koewokarashite"] },

  { word: "万雷の拍手", kana: "ばんらいのはくしゅ", romaji: ["banrainohakushu", "banrainohakusyu"] },
  { word: "一生忘れない", kana: "いっしょうわすれない", romaji: ["isshouwasurenai", "issyouwasurenai"] },
];

// ---------- ローマ字の表記ゆれを自動で展開する ----------
// 個別の単語ごとに手打ちしなくても、今後お題が増えたときに以下のルールが自動で効く：
//   ・「tsu」⇄「tu」（例: jounetsu ⇄ jounetu）
//   ・母音を重ねる長音表記 ⇄ ハイフン表記（例: ankooru ⇄ anko-ru）
function expandRomajiVariants(str) {
  let variants = new Set([str]);

  // tsu ⇄ tu
  let next = new Set();
  variants.forEach((v) => {
    next.add(v);
    if (v.includes("tsu")) {
      next.add(v.split("tsu").join("tu"));
    } else if (v.includes("tu")) {
      next.add(v.split("tu").join("tsu"));
    }
  });
  variants = next;

  // 長音（同じ母音の連続） ⇄ ハイフン
  next = new Set();
  const vowels = ["a", "i", "u", "e", "o"];
  variants.forEach((v) => {
    next.add(v);
    vowels.forEach((vw) => {
      const doubled = vw + vw;
      if (v.includes(doubled)) {
        next.add(v.split(doubled).join(vw + "-"));
      }
    });
  });
  variants = next;

  return Array.from(variants);
}

// 各お題リストの romaji 配列に、上記ルールで生成した表記ゆれをすべて追加する
function expandWordList(list) {
  list.forEach((w) => {
    const expanded = new Set();
    w.romaji.forEach((r) => expandRomajiVariants(r).forEach((v) => expanded.add(v)));
    w.romaji = Array.from(expanded);
  });
  return list;
}

[EASY_WORDS, NORMAL_WORDS, HARD_WORDS].forEach(expandWordList);

// ---------- 難易度設定 ----------
const DIFFICULTIES = {
  easy: {
    label: "かんたん",
    words: EASY_WORDS,
    correctHype: 5,
    missPenalty: 3,
  },
  normal: {
    label: "ふつう",
    words: NORMAL_WORDS,
    correctHype: 4,
    missPenalty: 6,
  },
  hard: {
    label: "むずかしい",
    words: HARD_WORDS,
    correctHype: 3,
    missPenalty: 9,
  },
};

// コンボ数に応じたスコア倍率
const COMBO_TIERS = [
  { min: 8, mult: 2.0 },
  { min: 5, mult: 1.5 },
  { min: 3, mult: 1.2 },
  { min: 0, mult: 1.0 },
];

const PENLIGHT_COLORS = ["--gold", "--pink", "--cyan"];
const GAME_SECONDS = 60;
const CROWD_SIZE = 63; // 9列 x 7段
const BEST_SCORE_KEY = "karaokeTyping.bestScores";
const MUTE_KEY = "karaokeTyping.muted";
const DIFF_KEY = "karaokeTyping.difficulty";

const el = {
  crowd: document.getElementById("crowd"),
  spotlight: document.getElementById("spotlight"),
  mic: document.getElementById("mic"),
  muteBtn: document.getElementById("muteBtn"),
  scoreValue: document.getElementById("scoreValue"),
  comboValue: document.getElementById("comboValue"),
  timeValue: document.getElementById("timeValue"),
  hypeFill: document.getElementById("hypeFill"),
  hypeBanner: document.getElementById("hypeBanner"),
  promptKana: document.getElementById("promptKana"),
  promptWord: document.getElementById("promptWord"),
  promptRomaji: document.getElementById("promptRomaji"),
  startOverlay: document.getElementById("startOverlay"),
  startBtn: document.getElementById("startBtn"),
  startBest: document.getElementById("startBest"),
  diffSelect: document.getElementById("diffSelect"),
  resultOverlay: document.getElementById("resultOverlay"),
  resultRank: document.getElementById("resultRank"),
  resultBest: document.getElementById("resultBest"),
  resultScore: document.getElementById("resultScore"),
  resultChars: document.getElementById("resultChars"),
  resultAcc: document.getElementById("resultAcc"),
  retryBtn: document.getElementById("retryBtn"),
};

let state = null;
let selectedDifficulty = "normal";

/* =========================================================
   ローカルストレージ関連（自己ベスト・ミュート・難易度）
   ========================================================= */

function safeGet(key) {
  try {
    return localStorage.getItem(key);
  } catch (err) {
    return null;
  }
}

function safeSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch (err) {
    // プライベートブラウズ等でlocalStorageが使えない場合は無視
  }
}

function loadBestScores() {
  try {
    return JSON.parse(safeGet(BEST_SCORE_KEY)) || {};
  } catch (err) {
    return {};
  }
}

function getBestScore(diff) {
  const scores = loadBestScores();
  return scores[diff] || 0;
}

function saveBestScoreIfHigher(diff, score) {
  const scores = loadBestScores();
  const prevBest = scores[diff] || 0;
  const isNew = score > prevBest;
  if (isNew) {
    scores[diff] = score;
    safeSet(BEST_SCORE_KEY, JSON.stringify(scores));
  }
  return { isNew, best: isNew ? score : prevBest };
}

function refreshStartBest() {
  const best = getBestScore(selectedDifficulty);
  el.startBest.textContent = `自己ベスト（${DIFFICULTIES[selectedDifficulty].label}）：${best}`;
}

/* =========================================================
   サウンド（Web Audio API / 追加ファイル不要）
   ========================================================= */

let audioCtx = null;
let muted = safeGet(MUTE_KEY) === "1";

function ensureAudio() {
  if (!audioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioCtx = new AudioCtx();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = "sine", peak = 0.15, delay = 0) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function sfxCorrect() {
  playTone(880, 0.08, "sine", 0.12);
}

function sfxMiss() {
  playTone(140, 0.16, "sawtooth", 0.14);
}

function sfxWordComplete() {
  playTone(660, 0.1, "triangle", 0.14);
  playTone(880, 0.12, "triangle", 0.14, 0.06);
  playTone(1100, 0.16, "triangle", 0.14, 0.12);
}

function sfxHypeMax() {
  playTone(523, 0.18, "triangle", 0.15);
  playTone(659, 0.18, "triangle", 0.15, 0.05);
  playTone(784, 0.18, "triangle", 0.15, 0.1);
  playTone(1047, 0.3, "triangle", 0.16, 0.15);
}

function sfxTick() {
  playTone(400, 0.05, "square", 0.06);
}

function updateMuteBtn() {
  el.muteBtn.textContent = muted ? "🔇" : "🔊";
  el.muteBtn.setAttribute("aria-pressed", String(muted));
}

el.muteBtn.addEventListener("click", () => {
  muted = !muted;
  safeSet(MUTE_KEY, muted ? "1" : "0");
  updateMuteBtn();
});
updateMuteBtn();

/* =========================================================
   ゲーム本体
   ========================================================= */

function buildCrowd() {
  el.crowd.innerHTML = "";
  el.crowd.classList.remove("wave");
  for (let i = 0; i < CROWD_SIZE; i++) {
    const p = document.createElement("div");
    p.className = "penlight";
    el.crowd.appendChild(p);
  }
}

function pickWord(excludeWord) {
  const pool = DIFFICULTIES[state.difficulty].words;
  let candidate;
  do {
    candidate = pool[Math.floor(Math.random() * pool.length)];
  } while (pool.length > 1 && candidate === excludeWord);
  return candidate;
}

function initState(difficulty) {
  return {
    running: false,
    difficulty,
    timeLeft: GAME_SECONDS,
    score: 0,
    correctChars: 0,
    missChars: 0,
    hype: 0,
    hypeCelebrated: false,
    combo: 0,
    current: null,
    typed: "",       // ローマ字入力の進捗
    typedKana: "",   // かな入力の進捗
    litCount: 0,
    timerId: null,
  };
}

function renderPrompt() {
  const { current, typed, typedKana } = state;
  el.promptWord.textContent = current.word;

  const kanaAnswer = current.kana;
  const doneK = kanaAnswer.slice(0, typedKana.length);
  const nextK = kanaAnswer.slice(typedKana.length, typedKana.length + 1);
  const restK = kanaAnswer.slice(typedKana.length + 1);
  el.promptKana.innerHTML =
    `<span class="romaji-done">${doneK}</span>` +
    `<span class="romaji-next">${nextK}</span>` +
    `<span class="romaji-rest">${restK}</span>`;

  const answer = current.romaji[0];
  const done = answer.slice(0, typed.length);
  const next = answer.slice(typed.length, typed.length + 1);
  const rest = answer.slice(typed.length + 1);
  el.promptRomaji.innerHTML =
    `<span class="romaji-done">${done}</span>` +
    `<span class="romaji-next">${next}</span>` +
    `<span class="romaji-rest">${rest}</span>`;
}

function nextWord() {
  state.current = pickWord(state.current);
  state.typed = "";
  state.typedKana = "";
  renderPrompt();
}

function comboMultiplier(combo) {
  const tier = COMBO_TIERS.find((t) => combo >= t.min);
  return tier ? tier.mult : 1.0;
}

function updateHud() {
  el.scoreValue.textContent = state.score;
  el.timeValue.textContent = state.timeLeft;
  el.timeValue.classList.toggle("time-warn", state.timeLeft <= 10);
  el.hypeFill.style.width = `${state.hype}%`;
  el.hypeFill.classList.toggle("maxed", state.hype >= 100);

  const mult = comboMultiplier(state.combo);
  if (state.combo >= 3) {
    el.comboValue.hidden = false;
    el.comboValue.textContent = `combo ${state.combo} (x${mult})`;
    el.comboValue.classList.toggle("boosted", mult > 1);
  } else {
    el.comboValue.hidden = true;
  }
}

function lightNextPenlight() {
  const lights = el.crowd.children;
  if (lights.length === 0) return;
  state.litCount = (state.litCount + 1) % lights.length;
  const target = lights[state.litCount];
  const color = PENLIGHT_COLORS[Math.floor(Math.random() * PENLIGHT_COLORS.length)];
  target.style.setProperty("--glow", `var(${color})`);
  target.classList.add("lit");
}

function flashMiss() {
  el.mic.classList.remove("miss");
  void el.mic.offsetWidth; // reflow で再アニメーションさせる
  el.mic.classList.add("miss");
}

function burstSpotlight() {
  el.spotlight.classList.remove("burst");
  void el.spotlight.offsetWidth;
  el.spotlight.classList.add("burst");
}

function celebrateHypeMax() {
  el.crowd.classList.add("wave");
  el.hypeBanner.classList.remove("show");
  void el.hypeBanner.offsetWidth;
  el.hypeBanner.classList.add("show");
  sfxHypeMax();
  setTimeout(() => el.crowd.classList.remove("wave"), 1400);
}

function isAnswerMatch(typed, romajiOptions) {
  return romajiOptions.some((r) => r === typed);
}

function isPrefixOfAny(typed, romajiOptions) {
  return romajiOptions.some((r) => r.startsWith(typed));
}

function isRomajiChar(ch) {
  return /^[a-zA-Z-]$/.test(ch);
}

function isHiraganaChar(ch) {
  return /^[\u3041-\u309F\u30FC]$/.test(ch);
}

function onCorrectKeystroke() {
  const cfg = DIFFICULTIES[state.difficulty];
  const mult = comboMultiplier(state.combo);
  state.correctChars += 1;
  state.score += Math.round(10 * mult);
  state.hype = Math.min(100, state.hype + cfg.correctHype);
  lightNextPenlight();
  sfxCorrect();

  if (state.hype >= 100 && !state.hypeCelebrated) {
    state.hypeCelebrated = true;
    celebrateHypeMax();
  }
}

function onMissKeystroke() {
  const cfg = DIFFICULTIES[state.difficulty];
  state.missChars += 1;
  state.combo = 0;
  state.hype = Math.max(0, state.hype - cfg.missPenalty);
  if (state.hype < 100) state.hypeCelebrated = false;
  flashMiss();
  sfxMiss();
}

function onWordComplete() {
  const mult = comboMultiplier(state.combo);
  state.combo += 1;
  state.score += Math.round(20 * mult);
  burstSpotlight();
  sfxWordComplete();
  nextWord();
}

function handleKanaInput(rawChar) {
  const attempt = state.typedKana + rawChar;
  const kanaAnswer = state.current.kana;

  if (kanaAnswer.startsWith(attempt)) {
    state.typedKana = attempt;
    onCorrectKeystroke();
    renderPrompt();
    updateHud();
    if (attempt === kanaAnswer) onWordComplete();
  } else {
    onMissKeystroke();
    updateHud();
  }
}

function handleRomajiInput(key) {
  const attempt = state.typed + key;
  const { romaji } = state.current;

  if (isPrefixOfAny(attempt, romaji)) {
    state.typed = attempt;
    onCorrectKeystroke();
    renderPrompt();
    updateHud();
    if (isAnswerMatch(state.typed, romaji)) onWordComplete();
  } else {
    onMissKeystroke();
    updateHud();
  }
}

function handleKeydown(e) {
  if (e.key.length !== 1 || !isRomajiChar(e.key)) return;
  typeChar(e.key);
}

function typeChar(rawKey) {
  if (!state || !state.running) return;

  if (isHiraganaChar(rawKey)) {
    handleKanaInput(rawKey);
  } else if (isRomajiChar(rawKey)) {
    handleRomajiInput(rawKey.toLowerCase());
  }
  // それ以外の文字（絵文字、記号、変換候補の確定前文字など）は無視
}

function tick() {
  state.timeLeft -= 1;
  updateHud();
  if (state.timeLeft <= 3 && state.timeLeft > 0) sfxTick();
  if (state.timeLeft <= 0) endGame();
}

function rankFor(score) {
  if (score >= 1400) return "伝説のボーカリスト";
  if (score >= 900) return "ライブの主役";
  if (score >= 500) return "頼れるバンドマン";
  if (score >= 200) return "見習いシンガー";
  return "路上ライブ初日";
}

function startGame() {
  ensureAudio();
  state = initState(selectedDifficulty);
  state.running = true;
  buildCrowd();
  nextWord();
  updateHud();
  el.startOverlay.hidden = true;
  el.resultOverlay.hidden = true;
  el.hypeBanner.classList.remove("show");
  state.timerId = setInterval(tick, 1000);

  // 「端末のキーボード」モードならゲーム開始と同時にフォーカスして開く
  if (nativeInput && !nativeInput.hidden) {
    nativeInput.focus();
  }
}

function endGame() {
  state.running = false;
  clearInterval(state.timerId);

  const totalChars = state.correctChars + state.missChars;
  const acc = totalChars === 0 ? 0 : Math.round((state.correctChars / totalChars) * 100);
  const { isNew, best } = saveBestScoreIfHigher(state.difficulty, state.score);

  el.resultRank.textContent = rankFor(state.score);
  el.resultScore.textContent = state.score;
  el.resultChars.textContent = state.correctChars;
  el.resultAcc.textContent = `${acc}%`;
  el.resultBest.innerHTML = isNew
    ? `<span class="is-new">自己ベスト更新！ ${best}</span>`
    : `自己ベスト（${DIFFICULTIES[state.difficulty].label}）：${best}`;
  el.resultOverlay.hidden = false;

  refreshStartBest();
}

el.startBtn.addEventListener("click", startGame);
el.retryBtn.addEventListener("click", startGame);
window.addEventListener("keydown", handleKeydown);

/* ---------- 難易度選択 ---------- */
if (el.diffSelect) {
  el.diffSelect.querySelectorAll(".diff-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      selectedDifficulty = btn.dataset.diff;
      el.diffSelect.querySelectorAll(".diff-btn").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      safeSet(DIFF_KEY, selectedDifficulty);
      refreshStartBest();
    });
  });

  const savedDiff = safeGet(DIFF_KEY);
  if (savedDiff && DIFFICULTIES[savedDiff]) {
    selectedDifficulty = savedDiff;
    el.diffSelect.querySelectorAll(".diff-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.diff === savedDiff);
    });
  }
}
refreshStartBest();

/* ---------- 入力方法の切り替え（専用キーボード / 端末のキーボード） ---------- */
const KBD_MODE_KEY = "karaokeTyping.kbdMode";
const vkb = document.getElementById("vkb");
const nativeInput = document.getElementById("nativeInput");
const kbdToggle = document.getElementById("kbdToggle");

function setKbdMode(mode) {
  const isNative = mode === "native";
  vkb.hidden = isNative;
  nativeInput.hidden = !isNative;

  kbdToggle.querySelectorAll(".kbd-toggle-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  safeSet(KBD_MODE_KEY, mode);

  if (isNative && state && state.running) {
    nativeInput.focus();
  }
}

if (kbdToggle) {
  kbdToggle.querySelectorAll(".kbd-toggle-btn").forEach((btn) => {
    btn.addEventListener("click", () => setKbdMode(btn.dataset.mode));
  });
  setKbdMode(safeGet(KBD_MODE_KEY) || "custom");
}

// 端末純正キーボードからの入力（ローマ字・かなの両方に対応。1文字ずつ拾ってすぐ入力欄をクリアする）
if (nativeInput) {
  nativeInput.addEventListener("input", () => {
    const chars = nativeInput.value.match(/[a-zA-Z\u3041-\u309F\u30FC-]/g) || [];
    chars.forEach((ch) => typeChar(ch));
    nativeInput.value = "";
  });
}

/* ---------- 専用オンスクリーンキーボード（タップ操作） ---------- */
if (vkb) {
  vkb.querySelectorAll(".vkb-key").forEach((btn) => {
    const key = btn.dataset.key;

    btn.addEventListener("pointerdown", () => btn.classList.add("pressed"));
    const release = () => btn.classList.remove("pressed");
    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointerleave", release);

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      typeChar(key);
    });
  });
}

// 初期表示
buildCrowd();

</script>
</body>
