<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ライブステージ・タイピング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- 客席のペンライト -->
  <div class="crowd" id="crowd"></div>

  <!-- スポットライト -->
  <div class="spotlight" id="spotlight"></div>

  <!-- 左上コントロール（ミュート・一時停止） -->
  <div class="top-controls">
    <button class="icon-btn" id="muteBtn" type="button" aria-pressed="false" aria-label="音を消す">🔊</button>
    <button class="icon-btn" id="pauseBtn" type="button" aria-label="一時停止">⏸</button>
  </div>

  <!-- HUD -->
  <header class="hud">
    <div class="hud-block">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="scoreValue">0</span>
      <span class="hud-combo" id="comboValue" hidden></span>
    </div>
    <div class="hype-wrap">
      <span class="hud-label">HYPE</span>
      <div class="hype-bar"><div class="hype-fill" id="hypeFill"></div></div>
    </div>
    <div class="hud-block hud-block--time">
      <span class="hud-label">TIME</span>
      <span class="hud-value" id="timeValue">60</span>
    </div>
  </header>

  <!-- HYPE満タン時のバナー -->
  <div class="hype-banner" id="hypeBanner">熱狂の渦！</div>

  <!-- マイク（ミス時に赤く光る） -->
  <div class="mic" id="mic">
    <svg viewBox="0 0 24 24" width="40" height="40">
      <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
    </svg>
  </div>

  <!-- プロンプター（お題表示） -->
  <main class="prompter">
    <p class="prompter-kana" id="promptKana">&nbsp;</p>
    <h1 class="prompter-word" id="promptWord">START</h1>
    <p class="prompter-romaji" id="promptRomaji">&nbsp;</p>
  </main>

  <!-- スタート画面 -->
  <div class="overlay" id="startOverlay">
    <h2 class="overlay-title">MIC CHECK</h2>
    <p class="overlay-text">表示された単語をローマ字・またはかなで打ち切って、<br>客席のペンライトを灯していこう。<br>制限時間は60秒のスコアアタック。</p>

    <div class="diff-grid" id="diffSelect" role="group" aria-label="難易度選択">
      <button type="button" class="diff-btn" data-diff="easy">
        <span class="diff-btn-title">かんたん</span>
        <span class="diff-btn-desc">短い単語中心</span>
      </button>
      <button type="button" class="diff-btn active" data-diff="normal">
        <span class="diff-btn-title">ふつう</span>
        <span class="diff-btn-desc">バランス型</span>
      </button>
      <button type="button" class="diff-btn" data-diff="hard">
        <span class="diff-btn-title">むずかしい</span>
        <span class="diff-btn-desc">長めの単語中心</span>
      </button>
      <button type="button" class="diff-btn" data-diff="expert">
        <span class="diff-btn-title">エキスパート</span>
        <span class="diff-btn-desc">一文フレーズのみ</span>
      </button>
    </div>

    <label class="practice-toggle">
      <input type="checkbox" id="practiceToggle">
      <span>練習モード（タイマーなし・スコア記録なし）</span>
    </label>

    <p class="best-note" id="startBest">自己ベスト：-</p>

    <button class="overlay-btn" id="startBtn">ステージに立つ</button>
  </div>

  <!-- 結果画面 -->
  <div class="overlay" id="resultOverlay" hidden>
    <h2 class="overlay-title" id="resultRank">-</h2>
    <p class="best-note" id="resultBest">自己ベスト：-</p>
    <div class="result-stats">
      <div><span class="hud-label">SCORE</span><span class="result-num" id="resultScore">0</span></div>
      <div><span class="hud-label">正打数</span><span class="result-num" id="resultChars">0</span></div>
      <div><span class="hud-label">正答率</span><span class="result-num" id="resultAcc">0%</span></div>
    </div>
    <button class="overlay-btn" id="retryBtn">アンコール（もう一度）</button>
    <button class="overlay-btn overlay-btn--sub" id="shareBtn">結果を画像で保存</button>
    <button class="overlay-btn overlay-btn--sub" id="backToMenuBtn">難易度を選びなおす</button>
  </div>

  <!-- 一時停止画面 -->
  <div class="overlay" id="pauseOverlay" hidden>
    <h2 class="overlay-title">一時停止中</h2>
    <button class="overlay-btn" id="resumeBtn">再開する</button>
    <button class="overlay-btn overlay-btn--sub" id="retireBtn">結果を見て終える</button>
    <button class="overlay-btn overlay-btn--sub" id="quitBtn">難易度選択に戻る</button>
  </div>

  <!-- カウントダウン画面 -->
  <div class="overlay countdown-overlay" id="countdownOverlay" hidden>
    <span class="countdown-num" id="countdownNum">3</span>
  </div>

</div>

<!-- タッチ端末用の入力エリア（物理キーボードがある環境では自動的に隠れる） -->
<div class="kbd-area" id="kbdArea" aria-hidden="true">

  <!-- キーボード表示中も常に見える、現在のお題のミニ表示（スマホでキーボードが開いて本体の表示が隠れても見えるように） -->
  <div class="mini-prompter" id="miniPrompter">
    <span class="mini-prompter-kana" id="miniPromptKana">&nbsp;</span>
    <span class="mini-prompter-word" id="miniPromptWord">-</span>
    <span class="mini-prompter-romaji" id="miniPromptRomaji">&nbsp;</span>
  </div>

  <!-- キーボード切り替えトグル -->
  <div class="kbd-toggle" id="kbdToggle" role="group" aria-label="入力方法の切り替え">
    <button type="button" class="kbd-toggle-btn active" data-mode="custom">ローマ字</button>
    <button type="button" class="kbd-toggle-btn" data-mode="flick">かな</button>
    <button type="button" class="kbd-toggle-btn" data-mode="native">端末のキーボード</button>
  </div>

  <!-- 専用オンスクリーンキーボード（ローマ字） -->
  <div class="vkb" id="vkb">
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="q">q</button>
      <button type="button" class="vkb-key" data-key="w">w</button>
      <button type="button" class="vkb-key" data-key="e">e</button>
      <button type="button" class="vkb-key" data-key="r">r</button>
      <button type="button" class="vkb-key" data-key="t">t</button>
      <button type="button" class="vkb-key" data-key="y">y</button>
      <button type="button" class="vkb-key" data-key="u">u</button>
      <button type="button" class="vkb-key" data-key="i">i</button>
      <button type="button" class="vkb-key" data-key="o">o</button>
      <button type="button" class="vkb-key" data-key="p">p</button>
    </div>
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="a">a</button>
      <button type="button" class="vkb-key" data-key="s">s</button>
      <button type="button" class="vkb-key" data-key="d">d</button>
      <button type="button" class="vkb-key" data-key="f">f</button>
      <button type="button" class="vkb-key" data-key="g">g</button>
      <button type="button" class="vkb-key" data-key="h">h</button>
      <button type="button" class="vkb-key" data-key="j">j</button>
      <button type="button" class="vkb-key" data-key="k">k</button>
      <button type="button" class="vkb-key" data-key="l">l</button>
    </div>
    <div class="vkb-row">
      <button type="button" class="vkb-key" data-key="z">z</button>
      <button type="button" class="vkb-key" data-key="x">x</button>
      <button type="button" class="vkb-key" data-key="c">c</button>
      <button type="button" class="vkb-key" data-key="v">v</button>
      <button type="button" class="vkb-key" data-key="b">b</button>
      <button type="button" class="vkb-key" data-key="n">n</button>
      <button type="button" class="vkb-key" data-key="m">m</button>
      <button type="button" class="vkb-key vkb-key--wide" data-key="-">ー</button>
    </div>
  </div>

  <!-- 専用オンスクリーンキーボード（かな・端末のフリック入力と同じ配置） -->
  <div class="flick-kb" id="flickKb" hidden>
    <div class="flick-preview" id="flickPreview" hidden></div>
    <div class="flick-grid">
      <button type="button" class="flick-key" data-row="あ">あ</button>
      <button type="button" class="flick-key" data-row="か">か</button>
      <button type="button" class="flick-key" data-row="さ">さ</button>
      <button type="button" class="flick-key" data-row="た">た</button>
      <button type="button" class="flick-key" data-row="な">な</button>
      <button type="button" class="flick-key" data-row="は">は</button>
      <button type="button" class="flick-key" data-row="ま">ま</button>
      <button type="button" class="flick-key" data-row="や">や</button>
      <button type="button" class="flick-key" data-row="ら">ら</button>
      <button type="button" class="flick-key flick-key--mod" id="flickModKey">゛゜小</button>
      <button type="button" class="flick-key" data-row="わ">わ</button>
      <button type="button" class="flick-key" id="flickLongKey">ー</button>
    </div>
  </div>

  <p class="kbd-hint">※ かなキーボードは指を離さず上下左右にフリックすると母音が切り替わります（上:う　左:い　右:え　下:お／「わ」のみ 左:を　上:ん　右:ー）</p>
  <p class="kbd-hint">※「つ」は tu、長音は ー（ハイフン）でも入力できます</p>

  <!-- 端末純正キーボード用の入力欄 -->
  <input
    type="text"
    id="nativeInput"
    class="native-input"
    placeholder="ここをタップしてローマ字 or かなで入力"
    autocomplete="off"
    autocapitalize="off"
    autocorrect="off"
    spellcheck="false"
    inputmode="text"
    aria-label="ローマ字入力欄"
    hidden
  >
</div>

<script src="script.js"></script>
</body>
</html>
